[project]
name = "binposert"
version = "0.1.0"
description = "Reliability-aware multi-view 6D pose estimation for robotic bin picking"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Muhammad Ahmad Masood" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "open3d>=0.18",
    "opencv-python-headless>=4.8",
    "trimesh>=4.0",
    "pandas>=2.1",
    "pyarrow>=14",
    "hydra-core>=1.3",
    "scikit-learn>=1.3",
    "matplotlib>=3.8",
    "imageio>=2.31",
    "tqdm>=4.66",
]

[project.optional-dependencies]
# Neural estimators run in their own Docker images (see docker/); this extra only exists so
# adapters can be developed on a GPU machine with the core installed alongside.
gpu = ["torch>=2.1"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-timeout>=2.3",
    "ruff>=0.6",
    "mypy>=1.10",
    "pandas-stubs",
    "types-tqdm",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["binposert"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 120
markers = [
    "gpu: needs a CUDA GPU and an estimator Docker image (skipped on the laptop)",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "NPY"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
