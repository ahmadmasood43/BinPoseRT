name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy binposert
      - run: uv run pytest -q -m "not gpu"
      - name: core imports without torch
        run: uv run python -c "import sys, binposert.evaluate, binposert.render, binposert.data; assert 'torch' not in sys.modules"
